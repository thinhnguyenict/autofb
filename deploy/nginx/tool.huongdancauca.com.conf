# AutoFB reverse proxy for aaPanel.
# Install as /www/server/panel/vhost/nginx/tool.huongdancauca.com.conf,
# replacing the generated server block for this website.

server {
    listen 80;
    listen [::]:80;
    server_name tool.huongdancauca.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/tool.huongdancauca.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tool.huongdancauca.com;

    ssl_certificate /www/server/panel/vhost/cert/tool.huongdancauca.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/tool.huongdancauca.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    access_log /www/wwwlogs/tool.huongdancauca.com.log;
    error_log /www/wwwlogs/tool.huongdancauca.com.error.log;
}
